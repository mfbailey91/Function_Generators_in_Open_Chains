architecture_version: 2
result_schema_version: 2
production_schema_version: 1
planning_space: output
seed: 20260804

study:
  name: production_monte_carlo_dijkstra
  stage: hardware_calibration
  sample_bank: null
  objective_cost: actuator_travel

search:
  algorithm: dijkstra

execution:
  workers: 1
  tasks_parallel_within_mechanism: false
  numerical_threads_per_worker: 1
  checkpoint_unit: mechanism_pair
  atomic_shards: true
  resume: true
  max_estimated_memory_fraction: 0.65
  require_override_above_limit: true
  memory_override: false

population:
  smoke_mechanisms: 2
  calibration_mechanisms: 8
  variance_pilot_mechanisms: 50
  minimum_production_mechanisms: 100
  maximum_production_mechanisms: 500
  production_batch_size: 25
  candidate_tasks_per_mechanism: [8, 12, 16]
  tasks_per_mechanism: 4
  candidate_pool_multiplier: 4
  confirmation_fraction: 0.15
  candidate_resolutions: [16, 32, 48]
  production_shape_n: 16

stopping:
  minimum_mechanisms: 8
  batch_size: 4
  maximum_mechanisms: 8
  confidence_level: 0.95
  target_ci_half_width_log_ratio: 0.20
  stable_batches_required: 1
  max_relative_estimate_change: 0.20
  hierarchical_bootstrap_samples: 80
  hierarchical_bootstrap_seed: 0

visualization:
  production_path_samples: 2
  render_during_search: false
  generate_canvas_after_run: true

branch:
  selection: monotonic_interval
  certification_samples_per_axis: 9
  minimum_abs_gain: 0.05
  inverse_tolerance: 1.0e-6
  endpoint_margin_fraction: 0.05
  n_samples: 96
  min_u_width: 0.3
  table_samples_per_axis: 33

sampling:
  domain: output
  shape: [16, 16]
  include_endpoints: true

edge_validation:
  samples: 5

matching_rule: span
tasks_output_tolerance: 100.0
