  n_samples: 64
  min_u_width: 0.3
  table_samples_per_axis: 17

sampling:
  domain: output
  shape: [8, 8]
  include_endpoints: true

edge_validation:
  samples: 9

tasks:
  source: fixed_output_pairs
  output_tolerance: 100.0
  use_query_overlays: true

matching_rule: span
