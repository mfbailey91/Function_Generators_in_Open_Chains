architecture_version: 2
result_schema_version: 2
planning_space: output

seed: 20260801

study:
  name: shared_q_paired_smoke
  mechanism_pair_ids: [pair_02]
  task_template_ids: [cross_range]
  alphas: [1.0, 0.5]
  reference_algorithm: dijkstra
  optional_algorithms: []

