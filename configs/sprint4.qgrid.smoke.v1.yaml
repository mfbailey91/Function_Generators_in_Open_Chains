# Sprint Four P2 smoke: monotonic uniform-U vs uniform-Q control (S4-11).
# Fixed four-bar; 2 trials × 2 representations × 2 algos = 8 rows.
# Config limits/ranges are overridden by the monotonic sector box.

seed: 0

mechanisms:
  gearbox:
    type: unit_gearbox
    dim: 2
    periodic: [true, true]
    name: unit_gearbox
  fourbar:
    mode: fixed
    mechanism:
      type: independent_fourbars
      name: fixed_fourbar
      bars:
        - type: planar_fourbar
          a: 1.0
          b: 2.5
          c: 2.0
          d: 2.0
          branch: 1
          periodic: [true]
          name: bar0
        - type: planar_fourbar
          a: 1.0
          b: 2.5
          c: 2.0
          d: 2.0
          branch: 1
          periodic: [true]
          name: bar1

graph:
  shape: [8, 8]
  wrap: [false, false]
  edge_samples: 5

limits:
  lower: [0.5, 0.5]
  upper: [2.5, 2.5]

cost:
  type: output_euclidean
  types: [output_euclidean]

algorithms:
  names: [dijkstra, astar]
  validate_heuristic: false

trials:
  n_trials: 2
  min_output_separation: 0.15
  preimage_policy: lex_min_node_id
  max_sample_attempts: 5000
  require_reachable: true
  n_path_samples: 0
